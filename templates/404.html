    <span class="empty-icon" aria-hidden="true">404</span>

    <h1>Page not found</h1>

    <p>
        We couldn't find the page you're looking for.

    <div class="form-actions">
        <a class="btn btn-primary" href="{{ url_for('index') }}">
            Go home →

        <a class="btn btn-secondary" href="{{ url_for('transactions') }}">
            View transactions
        </a>
    </div>

</section>

{% endblock %}
